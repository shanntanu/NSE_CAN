# Everything tunable lives here. The worker re-reads this file whenever it changes,
# so polling intervals, the model, prompts and channel switches apply without a restart.
# Secrets (API keys, tokens) are NOT here: put them in worker/.env (see .env.example).
# Any value can also be overridden by an environment variable, for example:
#   NSE_ALERTS__polling__nse__market_hours_interval_sec=3

app:
  timezone: Asia/Kolkata
  log_level: INFO

market:                      # decides which polling interval applies
  open: "09:00"              # includes pre-open
  close: "16:00"
  weekdays: [0, 1, 2, 3, 4]  # Monday=0 ... Sunday=6
  holidays: []               # exchange holidays as "YYYY-MM-DD", treated like weekends

universe:
  file: ../data/nifty50.csv  # symbols to track; refresh with: python -m nse_alerts.cli sync-universe
  store_non_universe: false  # also store announcements for stocks outside the universe

polling:
  nse:
    enabled: true
    market_hours_interval_sec: 5
    after_market_interval_sec: 60
    weekend_interval_sec: 300
    timeout_sec: 8
    announcements: true
    corporate_actions: true
    corporate_actions_every_n_polls: 6   # the corporate actions list changes slowly
    gap_fill: true                       # if the latest-20 window overflows, fetch the whole day
    base_url: https://www.nseindia.com
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    proxy_url_env: NSE_PROXY_URL         # optional: name of the env var holding a proxy URL
    failure_alert_after: 5               # consecutive failed polls before an outage warning
  bse:                                   # built but OFF until a proxy or another route is available
    enabled: false
    market_hours_interval_sec: 10
    after_market_interval_sec: 120
    weekend_interval_sec: 600
    timeout_sec: 8
    proxy_url_env: BSE_PROXY_URL
    scrip_map_file: ""                   # optional CSV: symbol,scrip_code (overrides name matching)
    duplicate_window_min: 10             # an item also seen on NSE within this window is a duplicate

alerts:
  categories: [announcement, corporate_action]   # add "news" once a news source is connected
  include_subjects: []                   # if set, only subjects containing one of these (case-insensitive)
  ignore_subjects: []                    # subjects containing any of these are stored but not sent
  max_event_age_sec: 600                 # older items (after a restart, say) are stored, not sent
  generate_summary_without_subscribers: false

context:                                 # fundamentals and technicals kept ready for every stock
  enabled: true
  refresh_market_hours_sec: 600
  refresh_after_market_sec: 21600
  max_age_sec: 172800                    # ignore cached data older than this
  concurrency: 4
  history_period: 1y
  news_items: 3

attachments:
  fetch_timeout_sec: 8
  max_size_mb: 45                        # above this the channel gets a link instead
  extract_text: true                     # read the filing PDF so the summary can use it
  text_timeout_sec: 6
  max_pages: 12
  max_chars: 9000

summary:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-4o-mini              # change freely: any OpenRouter model id
  fallback_model: ""                     # tried if the main model errors or times out
  provider_sort: ""                      # "", "latency", "throughput" or "price" (OpenRouter routing)
  temperature: 0.2
  max_tokens: 250
  bullets: 4                             # bullet points in the alert summary
  target_words: 80                       # the whole summary stays under max_words
  min_words: 60
  max_words: 100
  request_timeout_sec: 20
  deadline_sec: 35                       # seconds after the SLA clock starts; after this, send the template summary
  min_budget_sec: 8                      # the model always gets at least this long, even if the feed was late
  follow_up_model: ""                    # empty = same as model
  follow_up_max_words: 30
  follow_up_max_tokens: 120
  system_prompt: ""                      # empty = built-in prompt (see summarizer.py)

quotes:                                  # current price and volume shown under each alert
  enabled: true
  timeout_sec: 4
  index_symbol: "^NSEI"                  # Nifty 50 on Yahoo Finance, used to judge the follow-up

follow_up:                               # the update sent after the alert: did the news move the price?
  enabled: true
  delay_min: 30
  only_in_market_hours: true             # no follow-up for alerts that arrive after the close or on weekends
  min_gap_min: 5                         # if the market closes sooner than this, skip it
  categories: [announcement, corporate_action]
  neutral_band_pct: 0.3                  # a move within this band, relative to the Nifty, is "no clear impact"
  check_interval_sec: 15
  max_retries: 3
  summary_timeout_sec: 15

signals:                                 # past similar news and what a Rs 10,000 buy would have done
  enabled: true
  lookback_years: 5
  amount: 10000                          # rupees invested after each past case
  sentiment_tolerance: 10                # past cases must score within this of today's score
  tolerance_mode: points                 # points (60 matches 50-70) or percent (60 matches 54-66)
  min_confidence: 0.5                    # items the model judged too generic to score are left out
  min_cases: 5                           # fewer than this on the same stock: widen to all Nifty 50 stocks
  fallback_to_nifty50: true
  cooldown_days: 15                      # same-stock cases closer than this count once
  budget_sec: 12                         # scoring must finish within this or the section is left out
  send_details: true                     # second message listing each past case (Telegram)
  use_filing_text: true                  # live: read the filing when the exchange text is too generic
  score_model: ""                        # empty = same as summary.model
  score_concurrency: 6
  scoring_max_tokens: 120
  maintenance_interval_sec: 21600        # refresh prices and settle new 15/30 day outcomes

sla:
  target_sec: 60
  clock_start: listed                    # listed = from NSE dissemination time, detected = from our first sighting

delivery:
  max_attempts: 3
  retry_delay_sec: 1.0
  send_text_before_attachment: true

channels:
  telegram:                              # MTProto user-client (Telethon), ACTIVE
    enabled: true
    session: sessions/nse_alerts         # session file path (login once: cli telegram-login)
    send_attachments: true
    max_concurrency: 8
    min_interval_ms: 40                  # pause between sends to stay clear of flood limits
    flood_wait_max_sec: 10               # sleep and retry when Telegram asks for a short wait
    keep_contacts: true
    resolver_interval_sec: 3
    verification_interval_sec: 2
    max_new_people_per_hour: 60          # phone lookups and verification codes to new people, per hour
    handle_stop_keyword: true
  whatsapp:                              # WhatsApp Business Cloud API, built but OFF
    enabled: false
    api_version: v21.0
    template_name: nse_alert
    template_language: en
    template_has_document_header: false
    send_attachments: true
    max_concurrency: 8

retention:                               # keep the small shared database (Neon) small
  shared_days: 30                        # alerts older than this move to the server database; 0 = never move
  run_every_sec: 21600
  warn_shared_mb: 350                    # log a warning when the shared database passes this size
  backup_every_hours: 24                 # copy of the server database file (data/backups/)
  backups_to_keep: 7

status:
  shared_interval_sec: 30                # how often live status (heartbeat, feed health) is written to the shared database

admin:
  notify_phone: ""                       # optional: Telegram alert to this number on feed outage/recovery

heartbeat_interval_sec: 10
